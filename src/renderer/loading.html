<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
  />
  <meta name="color-scheme" content="dark" />
  <title>DSH Electron — Starting</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #16233a 0%, #0b1220 62%);
      color: #dbe5f2;
      -webkit-user-select: none;
      user-select: none;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(219, 229, 242, 0.18);
      border-top-color: #7aa2f7;
      animation: spin 0.9s linear infinite;
    }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.01em; }
    p { margin: 0; max-width: 34rem; color: #8fa3bf; font-size: 0.9rem; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Starting DeepSeek Harness</h1>
    <p>Preparing the local web UI. This window will open automatically when the harness is ready.</p>
  </main>
</body>
</html>
